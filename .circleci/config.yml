version: 2.1

commands:
  deploy_and_verify:
    description: "Deploy Mifos Gazelle and verify health"
    steps:
      - run:
          name: Deploy via run.sh
          command: |
            chmod +x ./run.sh
            echo "Deploying on $(uname -m)..."
            sudo ./run.sh -m deploy -u "$USER" -a all -d true

      - run:
          name: Verify pods are running
          command: |
            echo "Checking pod readiness..."
            if ! command -v kubectl &> /dev/null; then
              echo "ERROR: kubectl not found"; exit 1
            fi
            if ! kubectl cluster-info &> /dev/null; then
              echo "ERROR: Cannot connect to cluster"; exit 1
            fi

            if ! kubectl wait --for=condition=Ready pods --all --all-namespaces --timeout=300s; then
              echo "Failure: Some pods are not ready"; kubectl get pods --all-namespaces; exit 1
            fi

      - run:
          name: Verify endpoints
          command: |
            chmod +x src/utils/test-scripts/verify-endpoints.sh
            src/utils/test-scripts/verify-endpoints.sh

      - run:
          name: Wait for Fineract tenant API
          command: |
            echo "Waiting for Fineract greenbank tenant to be ready..."
            BASE="https://mifos.mifos.gazelle.test/fineract-provider/api/v1"
            AUTH="mifos:password"
            TENANT="greenbank"
            for i in $(seq 1 60); do
              http_code=$(curl -sk -o /dev/null -w "%{http_code}" \
                -u "$AUTH" -H "Fineract-Platform-TenantId: $TENANT" \
                "$BASE/clients")
              if [[ "$http_code" == "200" ]]; then
                paymenttypes=$(curl -sk \
                  -u "$AUTH" -H "Fineract-Platform-TenantId: $TENANT" \
                  "$BASE/paymenttypes")
                if [[ "$paymenttypes" =~ ^\[ && "$paymenttypes" != "[]" ]]; then
                  echo "Fineract tenant API ready (schema + seed data confirmed)"
                  exit 0
                fi
                echo "Attempt $i/60: schema ready, seed data pending — retrying in 10s..."
              else
                echo "Attempt $i/60: HTTP $http_code — retrying in 10s..."
              fi
              sleep 10
            done
            echo "ERROR: Fineract tenant API not ready after 600s"
            exit 1

      - run:
          name: Smoke test payment (make-payment.sh)
          command: |
            chmod +x src/utils/make-payment.sh
            echo "100" | src/utils/make-payment.sh

jobs:
  deploy-test-amd64:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - deploy_and_verify

  deploy-test-arm64:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.large
    steps:
      - checkout
      - deploy_and_verify

workflows:
  version: 2
  test-multi-arch:
    jobs:
      - deploy-test-amd64
      # - deploy-test-arm64
