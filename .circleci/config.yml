version: 2.1

commands:
  deploy_and_verify:
    description: "Deploy Mifos Gazelle and verify health"
    steps:
      - run:
          name: Set up Python venv
          command: |
            python3 -m venv .venv
            .venv/bin/pip install --quiet -r src/utils/data-loading/requirements.txt

      - run:
          name: Environment setup and deploy
          no_output_timeout: 40m
          command: |
            chmod +x ./setup-env.sh ./run.sh
            echo "Setting up environment on $(uname -m)..."
            sudo ./setup-env.sh -e local -u "$USER" -d true -y
            echo "Deploying..."
            ./run.sh -m deploy -a all -d true

      - run:
          name: Verify pods are running
          command: |
            echo "Checking pod readiness..."
            if ! command -v kubectl &> /dev/null; then
              echo "ERROR: kubectl not found"; exit 1
            fi
            if ! kubectl cluster-info &> /dev/null; then
              echo "ERROR: Cannot connect to cluster"; exit 1
            fi

            if ! kubectl wait --for=condition=Ready pods --all --all-namespaces --timeout=300s; then
              echo "Failure: Some pods are not ready"; kubectl get pods --all-namespaces; exit 1
            fi

      - run:
          name: Verify endpoints
          command: |
            chmod +x src/utils/test-scripts/verify-endpoints.sh
            src/utils/test-scripts/verify-endpoints.sh

      - run:
          name: Wait for Fineract data
          command: |
            echo "Waiting for Fineract clients to be seeded..."
            MAX_WAIT=600
            ELAPSED=0
            until curl -sk -u "mifos:password" \
              -H "Fineract-Platform-TenantId: greenbank" \
              "http://mifos.mifos.gazelle.test/fineract-provider/api/v1/clients?limit=1" \
              | grep -q '"totalFilteredRecords":[^0]'; do
              if [ $ELAPSED -ge $MAX_WAIT ]; then
                echo "ERROR: Fineract data not ready after ${MAX_WAIT}s"
                echo "Last API response:"
                curl -sk -u "mifos:password" \
                  -H "Fineract-Platform-TenantId: greenbank" \
                  "http://mifos.mifos.gazelle.test/fineract-provider/api/v1/clients?limit=1"
                exit 1
              fi
              echo "  [WAIT] Not ready yet, retrying in 30s... (${ELAPSED}s elapsed)"
              sleep 30
              ELAPSED=$((ELAPSED + 30))
            done
            echo "Fineract data ready."

      - run:
          name: Run test payment
          command: |
            chmod +x src/utils/make-payment.sh
            echo "10" | src/utils/make-payment.sh

  deploy_and_verify_openspp:
    description: "Build the OpenSPP2 image, deploy OpenSPP, and run its smoke test (amd64 only)"
    steps:
      - run:
          name: Environment setup (k3s)
          command: |
            chmod +x ./setup-env.sh ./run.sh
            sudo ./setup-env.sh -e local -u "$USER" -d true -y
      - run:
          name: Build and import the OpenSPP2 image (build-only, not published)
          command: |
            git clone --branch v19.0.2.0.0 --depth 1 https://github.com/OpenSPP/OpenSPP2.git repos/OpenSPP2
            docker build --target production -t ghcr.io/openmf/openspp:19.0 \
              -f repos/OpenSPP2/docker/Dockerfile repos/OpenSPP2
            docker save ghcr.io/openmf/openspp:19.0 | sudo k3s ctr images import -
      - run:
          name: Deploy OpenSPP
          command: ./run.sh -m deploy -a openspp -d true
      - run:
          name: Smoke test
          command: bash tests/openspp/smoke.sh

jobs:
  deploy-test-amd64:
    machine:
      image: ubuntu-2204:current
    resource_class: large
    steps:
      - checkout
      - deploy_and_verify

  deploy-test-arm64:
    machine:
      image: ubuntu-2204:current
    resource_class: arm.large
    steps:
      - checkout
      - deploy_and_verify

  # OpenSPP2 is amd64-only (postgis/postgis:18-3.6-alpine has no arm64), so it has no arm64 job.
  deploy-test-openspp-amd64:
    machine:
      image: ubuntu-2004:current
    resource_class: large
    steps:
      - checkout
      - deploy_and_verify_openspp

workflows:
  version: 2
  test-multi-arch:
    jobs:
      - deploy-test-amd64
      # - deploy-test-arm64
      - deploy-test-openspp-amd64
