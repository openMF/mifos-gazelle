# =============================================================================
# PaymentHub EE — Custom Resource instances
#
# Enabled (11 core components managed by the operator):
#   ph-ee-importer-rdbms, ph-ee-connector-channel, ph-ee-operations-app,
#   ph-ee-connector-mojaloop-java, ph-ee-connector-notifications, ph-ee-zeebe-ops,
#   ph-ee-connector-bulk, ph-ee-bulk-processor,
#   ph-ee-connector-mock-payment-schema, ph-ee-identity-account-mapper,
#   ph-ee-connector-ams-mifos
#
# Disabled (operator can enable via CR toggle when needed):
#   ph-ee-connector-gsma (image openmf/ph-ee-connector-gsma:v1.3.0-gazelle-1.1.0 not on Docker Hub),
#   ph-ee-importer-es, message-gateway, ph-ee-connector-crm,
#   ph-ee-connector-bill-pay, ph-ee-vouchers,
#   ph-ee-operations-web
# =============================================================================

apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: ph-ee-importer-rdbms
  namespace: paymenthub
spec:
  labels:
    namespace: paymenthub
  enabled: true
  rbacEnabled: false
  secretEnabled: true
  configMapEnabled: false
  ingressEnabled: false
  volMount:
    enabled: true
    name: ph-ee-config
  replicas: 1
  image: docker.io/openmf/ph-ee-importer-rdbms:mifos-v2.0.0
  containerPort: 8000
  resources:
    limits:
      cpu: 500m
      memory: 512M
    requests:
      cpu: 100m
      memory: 256M
  environment:
    - name: SPRING_PROFILES_ACTIVE
      value: local,tenantsConnection
    - name: DATASOURCE_CORE_USERNAME
      value: mifos
    - name: DATASOURCE_CORE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ph-ee-importer-rdbms-secret
          key: database-password
    - name: DATASOURCE_CORE_HOST
      value: operationsmysql
    - name: DATASOURCE_CORE_PORT
      value: "3306"
    - name: DATASOURCE_CORE_SCHEMA
      value: tenants
    - name: LOGGING_LEVEL_ROOT
      value: INFO
    - name: LOGGING_PATTERN_CONSOLE
      value: "%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n"
    - name: JAVA_TOOL_OPTIONS
      value: "-Xmx256M"
    - name: APPLICATION_BUCKET-NAME
      value: paymenthub-ee
    - name: CLOUD_AWS_S3BASEURL
      value: "http://minio:9000"
    - name: CLOUD_AWS_REGION_STATIC
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-region
    - name: AWS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-access-key
    - name: AWS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-secret-key

---

apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: ph-ee-connector-channel
  namespace: paymenthub
spec:
  enabled: true
  rbacEnabled: false
  secretEnabled: false
  configMapEnabled: false
  ingressEnabled: true
  volMount:
    enabled: true
    name: ph-ee-config
  replicas: 1
  image: docker.io/openmf/ph-ee-connector-channel:mifos-v2.0.0
  containerPort: 8443
  resources:
    limits:
      cpu: 500m
      memory: 512M
    requests:
      cpu: 100m
      memory: 256M
  ingress:
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/cors-allow-headers: 'platform-tenantid'
      nginx.ingress.kubernetes.io/cors-allow-methods: PUT, GET, POST, OPTIONS, DELETE
      nginx.ingress.kubernetes.io/cors-allow-origin: '*'
      nginx.ingress.kubernetes.io/enable-cors: "true"
    tls:
      - secretName: sandbox-secret
    rules:
      - host: channel.local
        paths:
          - path: "/"
            pathType: ImplementationSpecific
            backend:
              service:
                name: ph-ee-connector-channel
                port:
                  number: 8443
  services:
    - name: ph-ee-connector-channel
      ports:
        - name: port
          port: 8443
          targetPort: 8443
          protocol: TCP
        - name: http
          port: 82
          targetPort: 8443
          protocol: TCP
      selector:
        app: ph-ee-connector-channel
      sessionAffinity: None
      type: ClusterIP
  environment:
    - name: SPRING_PROFILES_ACTIVE
      value: "bb,tenants"
    - name: ZEEBE_BROKER_CONTACTPOINT
      value: "phee-infra-zeebe-gateway:26500"
    - name: DFSPIDS
      value: "greenbank,redbank,bluebank"
    - name: TRANSACTION-ID-LENGTH
      value: "20"
    - name: MPESA_NOTIFICATION_SUCCESS_ENABLED
      value: "false"
    - name: MPESA_NOTIFICATION_FAILURE_ENABLED
      value: "false"
    - name: LOGGING_LEVEL_ROOT
      value: "INFO"
    - name: LOGGING_PATTERN_CONSOLE
      value: "%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n"
    - name: operations_url
      value: "http://ph-ee-operations-app:80/api/v1"
    - name: operations_auth-enabled
      value: "false"
    - name: CHANNEL_TENANTPRIMARY_CLIENTID
      value: "mifos"
    - name: CHANNEL_TENANTPRIMARY_CLIENTSECRET
      value: "password"
    - name: CHANNEL_TENANTPRIMARY_TENANT
      value: "greenbank"
    - name: CHANNEL_TENANTSECONDARY_CLIENTID
      value: "mifos"
    - name: CHANNEL_TENANTSECONDARY_CLIENTSECRET
      value: "password"
    - name: CHANNEL_TENANTSECONDARY_TENANT
      value: "bluebank"
    - name: redis_idempotency_enabled
      value: "true"
    - name: redis_host
      value: "phee-infra-redis-master"
    - name: redis_port
      value: "6379"
    - name: redis_password
      valueFrom:
        secretKeyRef:
          name: phee-infra-redis
          key: redis-password
    - name: server_ssl_enabled
      value: "false"
    - name: JAVA_TOOL_OPTIONS
      value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m"

---

