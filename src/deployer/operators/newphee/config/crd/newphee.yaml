apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: newphees.paymenthub.mifos.io
spec:
  group: paymenthub.mifos.io
  names:
    kind: NewPhee
    listKind: NewPheeList
    plural: newphees
    singular: newphee
    shortNames:
      - nph
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Enabled
          type: boolean
          jsonPath: .spec.enabled
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: true
                  description: Whether the newphee component should be running
                replicas:
                  type: integer
                  default: 1
                  minimum: 0
                  maximum: 10
                  description: Number of newphee pod replicas
                namespace:
                  type: string
                  default: newphee
                  description: Kubernetes namespace to deploy into
                image:
                  type: object
                  properties:
                    repository:
                      type: string
                      default: newphee
                    tag:
                      type: string
                      default: latest
                zeebeGateway:
                  type: string
                  default: zeebe-gateway.paymenthub.svc.cluster.local:26500
                  description: Address of the Zeebe gateway in the paymenthub namespace
                paymenthub:
                  type: object
                  properties:
                    namespace:
                      type: string
                      default: paymenthub
                    operationsDb:
                      type: object
                      properties:
                        host:
                          type: string
                          default: operationsmysql.paymenthub.svc.cluster.local
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current phase: Initializing | Ready | Disabled | Error"
                lastReconciled:
                  type: string
                  format: date-time
