# PaymentHub operator's own Deployment — not a PaymentHubDeployment CR, since
# the operator is what reconciles those; applied directly by deploy_ph_operator()
# in src/deployer/paymenthub.sh, the same way operator_rbac.yaml is.
#
# The image is pinned to an exact dev-<sha> tag, like the PaymentHubDeployment
# CRs, so IfNotPresent always runs that build. To move to a newer operator,
# change the tag. Images older than dev-dd9ac20 can't parse the CRD's
# volMount.mounts field, and images older than PHEE-455 ignore spec.localDev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymenthub-ee-operator
  namespace: paymenthub
  labels:
    app: paymenthub-ee-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paymenthub-ee-operator
  template:
    metadata:
      labels:
        app: paymenthub-ee-operator
    spec:
      serviceAccountName: paymenthub-ee-operator-sa
      containers:
        - name: operator
          image: docker.io/openmf/paymenthub-ee-k8s-operators:dev-7350a2c
          imagePullPolicy: IfNotPresent
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: INFO
            # Lets CRs run from a local build (spec.localDev, hostPath). deploy_ph_operator
            # sets it to "true" on local clusters (k3s/Colima); keep it false anywhere else.
            - name: LOCALDEV_ENABLED
              value: "false" # localdev-opt-in
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
