apiVersion: v1
kind: ServiceAccount
metadata:
  name: paymenthub-ee-operator-sa
  namespace: paymenthub

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: paymenthub-ee-operator-role
rules:
- apiGroups:
  - ""
  resources:
  - deployments
  - services
  - serviceaccounts
  - configmaps
  - secrets
  - pods
  verbs:
  - '*'
- apiGroups:
  - "apps"
  resources:
  - deployments
  - services
  - configmaps
  verbs:
  - '*'
- apiGroups:
  - "apiextensions.k8s.io"
  resources:
  - customresourcedefinitions
  verbs:
  - '*'
- apiGroups:
  - "gazelle.mifos.io"
  resources:
  - paymenthubdeployments
  - paymenthubdeployments/status
  verbs:
  - '*'
- apiGroups:
  - "rbac.authorization.k8s.io"
  resources:
  - roles
  - rolebindings
  - clusterroles
  - clusterrolebindings
  verbs:
  - '*'
- apiGroups:
  - networking.k8s.io
  resources:
  - ingresses
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
  - delete

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: paymenthub-ee-operator-role-binding
subjects:
  - kind: ServiceAccount
    name: paymenthub-ee-operator-sa
    namespace: paymenthub
roleRef:
  kind: ClusterRole
  name: paymenthub-ee-operator-role
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paymenthub-ee-operator-role
  namespace: paymenthub
rules:
- apiGroups:
  - gazelle.mifos.io
  resources:
  - paymenthubdeployments
  - paymenthubdeployments/status
  verbs:
  - '*'

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: paymenthub-ee-operator-role-binding
  namespace: paymenthub
subjects:
  - kind: ServiceAccount
    name: paymenthub-ee-operator-sa
    namespace: paymenthub
roleRef:
  kind: Role
  name: paymenthub-ee-operator-role
  apiGroup: rbac.authorization.k8s.io
