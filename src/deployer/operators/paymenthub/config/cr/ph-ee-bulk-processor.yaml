apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: ph-ee-bulk-processor
  namespace: paymenthub
spec:
  enabled: true
  waitForGatewayEnabled: true
  volMount:
    enabled: true
    name: ph-ee-config
  replicas: 1
  image: docker.io/openmf/ph-ee-bulk-processor:dev-latest
  containerPort: 8443
  resources:
    limits:
      cpu: 500m
      memory: 768M
    requests:
      cpu: 100m
      memory: 384M
  rbacEnabled: false
  secretEnabled: true
  configMapEnabled: false
  ingressEnabled: true
  ingress:
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "*"
      nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE, PATCH"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Platform-TenantId,platform-tenantid,purpose,Purpose,type,filename,x-callback-url,x-callbackurl,X-CallbackURL,x-correlationid,x-correlation-id,X-Correlation-ID,x-program-id,x-registering-institution-id,x-signature,privateKey,privatekey,Sec-Fetch-Dest,Sec-Fetch-Mode,Sec-Fetch-Site,Sec-GPC,Pragma"
      nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range,X-Correlation-ID,x-correlation-id"
      nginx.ingress.kubernetes.io/cors-max-age: "86400"
      nginx.ingress.kubernetes.io/enable-access-log: "true"
    tls:
      - secretName: sandbox-secret
    rules:
      - host: bulk-processor.local
        paths:
          - path: "/batchtransactions"
            pathType: ImplementationSpecific
            backend:
              service:
                name: ph-ee-bulk-processor
                port:
                  number: 80
  services:
    - name: ph-ee-bulk-processor
      ports:
        - name: port
          port: 80
          targetPort: 8443
          protocol: TCP
        - name: actuator
          port: 8080
          targetPort: 8080
          protocol: TCP
      selector:
        app: ph-ee-bulk-processor
      sessionAffinity: None
      type: ClusterIP
  livenessProbe:
    path: /actuator/health/liveness
    port: 8443
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  readinessProbe:
    path: /actuator/health/readiness
    port: 8443
    initialDelaySeconds: 45
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  environment:
    - name: SPRING_PROFILES_ACTIVE
      value: "bb"
    - name: ZEEBE_BROKER_CONTACTPOINT
      value: "paymenthub-infra-zeebe-gateway:26500"
    - name: TENANTS
      value: "greenbank,bluebank,redbank"
    - name: SERVER_SSL_ENABLED
      value: "false"
    - name: CAMEL_DISABLE_SSL
      value: "true"
    - name: OPERATIONS_APP_CONTACTPOINT
      value: "http://ph-ee-operations-app:80"
    - name: OPERATIONS_APP_ENDPOINTS_BATCH_TRANSACTION
      value: "/api/v1/batch/transactions"
    - name: IDENTITY_MAPPER_CONTACTPOINT
      value: ""
    - name: APPLICATION_BUCKET_NAME
      value: "paymenthub-ee"
    - name: CLOUD_AWS_S3BASEURL
      value: "http://minio:9000"
    - name: CLOUD_AWS_REGION_STATIC
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-region
    - name: AWS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-access-key
    - name: AWS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-secret-key
    - name: FINERACT_DATASOURCE_CORE_USERNAME
      value: "mifos"
    - name: FINERACT_DATASOURCE_CORE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: ph-ee-operations-app-secret
          key: database-password
    - name: FINERACT_DATASOURCE_CORE_HOST
      value: "operationsmysql"
    - name: FINERACT_DATASOURCE_CORE_PORT
      value: "3306"
    - name: BULK_PROCESSOR_CALLBACK_URL
      value: "http://ph-ee-bulk-processor:80/authorization/callback"
    - name: CONFIG_PARTYLOOKUP_ENABLE
      value: "true"
    - name: CONFIG_APPROVAL_ENABLE
      value: "false"
    - name: CONFIG_ORDERING_ENABLE
      value: "false"
    - name: CONFIG_ORDERING_FIELD
      value: ""
    - name: CHANNEL_HOSTNAME
      value: "http://ph-ee-connector-channel:8443"
    - name: CONFIG_SPLITTING_ENABLE
      value: "true"
    - name: CONFIG_SPLITTING_SUB_BATCH_SIZE
      value: "5"
    - name: CONFIG_FORMATTING_ENABLE
      value: "false"
    - name: CONFIG_FORMATTING_STANDARD
      value: "DEFAULT"
    - name: CONFIG_MERGEBACK_ENABLE
      value: "true"
    - name: CONFIG_BACKPRESSURE_ENABLE
      value: "false"
    - name: CONFIG_COMPLETION_THRESHOLD_CHECK_ENABLE
      value: "true"
    - name: CONFIG_COMPLETION_THRESHOLD_CHECK_COMPLETION_RATE
      value: "95"
    - name: DEDUPLICATION_ENABLED
      value: "true"
    - name: LOGGING_LEVEL_ROOT
      value: "INFO"
    - name: JAVA_TOOL_OPTIONS
      value: "-Xms128m -Xmx384m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m"
