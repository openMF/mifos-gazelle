apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: paymenthub-ee-bff
  namespace: paymenthub
spec:
  enabled: true
  rbacEnabled: false
  secretEnabled: true
  configMapEnabled: false
  ingressEnabled: true
  volMount:
    enabled: true
    name: ph-ee-config
  replicas: 1
  # Migrated to paymenthub-ee-bff (Java 21/Spring Boot 3.4; renamed "bff",
  # also absorbs ph-ee-operations-g2p-service). Port unchanged (5000, single
  # exposed port confirmed via `docker inspect`).
  image: docker.io/openmf/paymenthub-ee-bff:dev-latest
  containerPort: 5000
  resources:
    limits:
      cpu: 500m
      memory: 512M
    requests:
      cpu: 100m
      memory: 256M
  ingress:
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "*"
      nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE, PATCH"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Platform-TenantId,platform-tenantid,purpose,Purpose,type,filename,x-callback-url,x-callbackurl,X-CallbackURL,x-correlationid,x-correlation-id,X-Correlation-ID,x-program-id,x-registering-institution-id,x-signature,privateKey,privatekey,Sec-Fetch-Dest,Sec-Fetch-Mode,Sec-Fetch-Site,Sec-GPC,Pragma"
      nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range,X-Correlation-ID,x-correlation-id"
      nginx.ingress.kubernetes.io/cors-max-age: "86400"
      nginx.ingress.kubernetes.io/enable-access-log: "true"
    tls:
      - secretName: sandbox-secret
    rules:
      - host: ops-bk.local
        paths:
          - path: "/"
            pathType: ImplementationSpecific
            backend:
              service:
                name: paymenthub-ee-bff
                port:
                  number: 80
  services:
    - name: paymenthub-ee-bff
      ports:
        - name: port
          port: 80
          targetPort: 5000
          protocol: TCP
      selector:
        app: paymenthub-ee-bff
      sessionAffinity: None
      type: ClusterIP
  livenessProbe:
    path: /actuator/health
    port: 5000
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  # NOTE: old readiness path was /oauth/token_key (Spring Security OAuth2
  # authorization-server endpoint) — that's Boot 2.x legacy and very unlikely
  # to exist unchanged on the Boot 3.4 bff image. Best-guess replacement below
  # matches the /actuator/health/{liveness,readiness} convention used by every
  # other migrated CR; verify against real pod behavior during redeploy and
  # fix forward if this is wrong.
  readinessProbe:
    path: /actuator/health/readiness
    port: 5000
    initialDelaySeconds: 45
    periodSeconds: 180
    failureThreshold: 3
    timeoutSeconds: 5
  environment:
    - name: FINERACT_DATASOURCE_CORE_USERNAME
      value: "mifos"
    - name: FINERACT_DATASOURCE_CORE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-bff-secret
          key: database-password
    - name: FINERACT_DATASOURCE_CORE_HOST
      value: "operationsmysql"
    - name: FINERACT_DATASOURCE_CORE_PORT
      value: "3306"
    - name: FINERACT_DATASOURCE_CORE_SCHEMA
      value: "tenants"
    - name: SPRING_PROFILES_ACTIVE
      value: "bb"
    - name: TOKEN_CLIENT_CHANNEL_SECRET
      value: ""
    - name: TENANTS
      value: "greenbank,bluebank,redbank"
    - name: LOGGING_LEVEL_ROOT
      value: "INFO"
    - name: LOGGING_PATTERN_CONSOLE
      value: "%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n"
    - name: CLOUD_AWS_S3BASEURL
      value: "http://minio:9000"
    - name: APPLICATION_BUCKET-NAME
      value: "paymenthub-ee"
    - name: CLOUD_AWS_REGION_STATIC
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-connector-bulk-secret
          key: aws-region
    - name: AWS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-connector-bulk-secret
          key: aws-access-key
    - name: AWS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-connector-bulk-secret
          key: aws-secret-key
    - name: CLOUD_AWS_CREDENTIALS_ACCESS-KEY
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-connector-bulk-secret
          key: aws-access-key
    - name: CLOUD_AWS_CREDENTIALS_SECRET-KEY
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-connector-bulk-secret
          key: aws-secret-key
    - name: JAVA_TOOL_OPTIONS
      value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m"
