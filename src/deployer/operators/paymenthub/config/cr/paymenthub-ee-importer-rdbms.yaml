apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: paymenthub-ee-importer-rdbms
  namespace: paymenthub
spec:
  labels:
    namespace: paymenthub
  enabled: true
  waitForGatewayEnabled: true
  rbacEnabled: false
  secretEnabled: true
  configMapEnabled: false
  ingressEnabled: false
  volMount:
    enabled: true
    name: ph-ee-config
  replicas: 1
  # Migrated to paymenthub-ee-importer-rdbms (module of paymenthub-ee-data-pipeline,
  # Java 21/Spring Boot 3.4). No floating tag exists yet for this repo — its
  # CircleCI config only pushes <branch>-<sha> tags on dev, and a floating
  # "latest" tag only builds on main/master (confirmed via .circleci/config.yml).
  # Pinned to the merge commit's tag; bump when a newer commit/tag is needed.
  # containerPort unchanged: server.port=8000 in the new application.yml
  # matches exactly. Added liveness/readiness probes for the first time —
  # confirmed via source (Healthcheck.java): a plain HttpServer on port 5000
  # answering "/" with 200 (anything else 404), independent of Spring's
  # server.port/actuator entirely.
  image: docker.io/openmf/paymenthub-ee-importer-rdbms:dev-9dfd119
  containerPort: 8000
  livenessProbe:
    path: /
    port: 5000
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  readinessProbe:
    path: /
    port: 5000
    initialDelaySeconds: 45
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  resources:
    limits:
      cpu: 500m
      memory: 768M
    requests:
      cpu: 100m
      memory: 384M
  environment:
    - name: SPRING_PROFILES_ACTIVE
      value: local,tenantsConnection
    - name: DATASOURCE_CORE_USERNAME
      value: mifos
    - name: DATASOURCE_CORE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-importer-rdbms-secret
          key: database-password
    - name: DATASOURCE_CORE_HOST
      value: operationsmysql
    - name: DATASOURCE_CORE_PORT
      value: "3306"
    - name: DATASOURCE_CORE_SCHEMA
      value: tenants
    - name: LOGGING_LEVEL_ROOT
      value: INFO
    - name: LOGGING_PATTERN_CONSOLE
      value: "%d{dd-MM-yyyy HH:mm:ss.SSS} %magenta([%thread]) %highlight(%-5level) %logger.%M - %msg%n"
    - name: JAVA_TOOL_OPTIONS
      value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m"
    - name: APPLICATION_BUCKET-NAME
      value: paymenthub-ee
    - name: CLOUD_AWS_S3BASEURL
      value: "http://minio:9000"
    - name: CLOUD_AWS_REGION_STATIC
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-connector-bulk-secret
          key: aws-region
    - name: AWS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-connector-bulk-secret
          key: aws-access-key
    - name: AWS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-connector-bulk-secret
          key: aws-secret-key
