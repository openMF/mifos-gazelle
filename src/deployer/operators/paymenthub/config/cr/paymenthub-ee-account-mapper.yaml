apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: paymenthub-ee-account-mapper
  namespace: paymenthub
spec:
  enabled: true
  waitForGatewayEnabled: true
  rbacEnabled: false
  secretEnabled: true
  configMapEnabled: false
  ingressEnabled: true
  initContainerEnabled: true
  volMount:
    enabled: false
  replicas: 1
  # Migrated to paymenthub-ee-account-mapper (Java 21/Spring Boot 3.4; also
  # absorbs ph-ee-id-account-validator-impl as a "validator" module). Tag
  # downgrades from pinned mifos-v2.0.0 to floating dev-latest — no semver
  # tags exist yet on the new repo. Port unchanged (8080, confirmed via
  # `docker inspect`).
  image: docker.io/openmf/paymenthub-ee-account-mapper:dev-latest
  containerPort: 8080
  resources:
    limits:
      cpu: 500m
      memory: 768M
    requests:
      cpu: 100m
      memory: 384M
  ingress:
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/cors-allow-headers: 'x-registering-institution-id, content-type, X-CallbackURL'
      nginx.ingress.kubernetes.io/cors-allow-methods: PUT, GET, POST, OPTIONS, DELETE
      nginx.ingress.kubernetes.io/cors-allow-origin: '*'
      nginx.ingress.kubernetes.io/enable-cors: "true"
    tls:
      - secretName: sandbox-secret
    rules:
      - host: identity-mapper.local
        paths:
          - path: "/"
            pathType: ImplementationSpecific
            backend:
              service:
                name: paymenthub-ee-account-mapper
                port:
                  number: 80
  services:
    - name: paymenthub-ee-account-mapper
      ports:
        - name: port
          port: 80
          targetPort: 8080
          protocol: TCP
      selector:
        app: paymenthub-ee-account-mapper
      sessionAffinity: None
      type: ClusterIP
  livenessProbe:
    path: /actuator/health/liveness
    port: 8080
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  readinessProbe:
    path: /actuator/health/readiness
    port: 8080
    initialDelaySeconds: 45
    periodSeconds: 30
    failureThreshold: 3
    timeoutSeconds: 5
  environment:
    - name: SPRING_PROFILES_ACTIVE
      value: "bb"
    - name: ZEEBE_BROKER_CONTACTPOINT
      value: "paymenthub-infra-zeebe-gateway:26500"
    - name: ZEEBE_CLIENT_MAX-EXECUTION-THREADS
      value: "10"
    - name: ZEEBE_CLIENT_POLL-INTERVAL
      value: "10"
    - name: SPRING_DATASOURCE_URL
      value: "jdbc:mysql://operationsmysql:3306/identity_account_mapper"
    - name: SPRING_DATASOURCE_USERNAME
      value: "mifos"
    - name: SPRING_DATASOURCE_PASSWORD
      valueFrom:
        secretKeyRef:
          name: paymenthub-ee-account-mapper-secret
          key: database-password
    - name: LOGGING_LEVEL_ROOT
      value: "INFO"
    - name: JAVA_TOOL_OPTIONS
      value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m"
    - name: MOJALOOP_CONNECTOR_CONTACTPOINT
      value: "http://account-lookup-http-oracle-svc.vnext.svc.cluster.local:3031/_interop"
    - name: GSMA_CONNECTOR_CONTACTPOINT
      value: "http://paymenthub-ee-connector-ams-mifosx"
    # callback_enabled defaults to false, which silently disables SendCallbackService --
    # AccountLookupService never POSTs back to the caller-supplied callbackURL after a
    # batch account lookup finishes. That leaves bulk-processor's "Batch Account Lookup
    # response" receiveTask waiting on a message that's never sent: no exception, no Zeebe
    # incident, just permanently ACTIVE. Confirmed via Zeebe Operate on a live stuck
    # instance of bulk_processor_account_lookup-greenbank.
    - name: CALLBACK_ENABLED
      value: "true"

# =============================================================================
# Disabled components — set enabled: true to activate via operator
# =============================================================================
