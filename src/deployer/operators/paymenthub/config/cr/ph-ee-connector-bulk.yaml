apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: ph-ee-connector-bulk
  namespace: paymenthub
spec:
  enabled: true
  volMount:
    enabled: true
    name: ph-ee-config
  replicas: 1
  # Migrated to paymenthub-ee-connector-bulk (Java 21/Spring Boot 3.4). Port
  # unchanged (8080), confirmed via `docker inspect`.
  image: docker.io/openmf/paymenthub-ee-connector-bulk:dev-latest
  containerPort: 8080
  resources:
    limits:
      cpu: 256m
      memory: 512M
    requests:
      cpu: 100m
      memory: 256M
  rbacEnabled: false
  secretEnabled: true
  configMapEnabled: false
  # aws-region/aws-access-key/aws-secret-key back the CLOUD_AWS_* env vars below,
  # pointed at the local minio instance rather than real AWS.
  secretData:
    aws-access-key: root
    aws-secret-key: password
    aws-region: ap-south-1
  ingressEnabled: true
  ingress:
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "*"
      nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE, PATCH"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Platform-TenantId,platform-tenantid,purpose,Purpose,type,filename,x-callback-url,x-callbackurl,X-CallbackURL,x-correlationid,x-correlation-id,X-Correlation-ID,x-program-id,x-registering-institution-id,x-signature,privateKey,privatekey,Sec-Fetch-Dest,Sec-Fetch-Mode,Sec-Fetch-Site,Sec-GPC,Pragma"
      nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range,X-Correlation-ID,x-correlation-id"
      nginx.ingress.kubernetes.io/cors-max-age: "86400"
      nginx.ingress.kubernetes.io/enable-access-log: "true"
    tls:
      - secretName: sandbox-secret
    rules:
      - host: connector.local
        paths:
          - path: "/"
            pathType: ImplementationSpecific
            backend:
              service:
                name: ph-ee-connector-bulk
                port:
                  number: 80
  services:
    - name: ph-ee-connector-bulk
      ports:
        - name: port
          port: 80
          targetPort: 8080
          protocol: TCP
      selector:
        app: ph-ee-connector-bulk
      sessionAffinity: None
      type: ClusterIP
  environment:
    - name: SPRING_PROFILES_ACTIVE
      value: "bb"
    - name: CAMEL_DISABLE-SSL
      value: "true"
    - name: ZEEBE_BROKER_CONTACTPOINT
      value: "paymenthub-infra-zeebe-gateway:26500"
    - name: ZEEBE_CLIENT_MAX-EXECUTION-THREADS
      value: "50"
    - name: ZEEBE_CLIENT_POLL-INTERVAL
      value: "10"
    - name: TENANTS
      value: "greenbank,bluebank,redbank"
    - name: CLOUD_AWS_BUCKET-NAME
      value: "paymenthub-ee"
    - name: CLOUD_AWS_S3BASEURL
      value: "http://minio:9000"
    - name: CLOUD_AWS_REGION_STATIC
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-region
    - name: AWS_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-access-key
    - name: AWS_SECRET_KEY
      valueFrom:
        secretKeyRef:
          name: ph-ee-connector-bulk-secret
          key: aws-secret-key
    - name: OPERATIONS_APP_CONTACTPOINT
      value: "http://ph-ee-operations-app:80"
    - name: OPERATIONS_APP_ENDPOINTS_BATCH_SUMMARY
      value: "/api/v1/batch"
    - name: OPERATIONS_APP_ENDPOINTS_BATCH_DETAIL
      value: "/api/v1/batch/detail"
    - name: MOCK_PAYMENT_SCHEMA_CONTACTPOINT
      value: "http://ph-ee-connector-mock-payment-schema:8080"
    - name: MOCK_PAYMENT_SCHEMA_ENDPOINTS_BATCH_SUMMARY
      value: "/mockapi/v1/batch"
    - name: MOCK_PAYMENT_SCHEMA_ENDPOINTS_BATCH_DETAIL
      value: "/mockapi/v1/batch/detail"
    - name: BULK_PROCESSOR_CONTACTPOINT
      value: "http://ph-ee-bulk-processor:80"
    - name: BULK_PROCESSOR_ENDPOINTS_BATCH_TRANSACTION
      value: "/batchtransactions"
    - name: IDENTITY_MAPPER_CONTACTPOINT
      value: "http://ph-ee-identity-account-mapper:80"
    - name: CHANNEL_CONTACTPOINT
      value: "http://ph-ee-connector-channel:8443"
    - name: CHANNEL_ENDPOINTS_TRANSFER
      value: "/channel/transfer"
    - name: BULK_PROCESSOR_ENDPOINTS_BATCH_EXECUTION
      value: "/batchtransactions/execution"
    - name: JAVA_TOOL_OPTIONS
      value: "-Xms64m -Xmx192m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=96m"
