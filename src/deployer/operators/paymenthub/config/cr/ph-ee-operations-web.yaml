apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: ph-ee-operations-web
  namespace: paymenthub
spec:
  enabled: true
  domain: GAZELLE_DOMAIN
  volMount:
    enabled: true
    name: ph-ee-operations-web-configmap
  replicas: 1
  image: docker.io/openmf/ph-ee-operations-web:v1.20.0
  containerPort: 80
  resources:
    limits:
      cpu: 500m
      memory: 512M
    requests:
      cpu: 100m
      memory: 256M
  rbacEnabled: false
  secretEnabled: false
  configMapEnabled: true
  ingressEnabled: true
  ingress:
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
    tls:
      - secretName: sandbox-secret
    rules:
      - host: ops.local
        paths:
          - path: "/"
            pathType: ImplementationSpecific
            backend:
              service:
                name: ph-ee-operations-web
                port:
                  number: 4200
  services:
    - name: ph-ee-operations-web
      ports:
        - name: port
          port: 4200
          targetPort: 80
          protocol: TCP
      selector:
        app: ph-ee-operations-web
      sessionAffinity: None
      type: ClusterIP
  environment:
    - name: PH_OPS_BACKEND_SERVER_URL
      value: "http://ph-ee-operations-app:80/api/v1"
    - name: PH_VOU_BACKEND_SERVER_URL
      value: "http://ph-ee-operations-app:80/api/v1"
    - name: PH_ACT_BACKEND_SERVER_URL
      value: "http://ph-ee-identity-account-mapper:80"
    - name: PH_PLATFORM_TENANT_ID
      value: "greenbank"
    - name: PH_AUTH_ENABLED
      value: "false"
