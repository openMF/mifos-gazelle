apiVersion: gazelle.mifos.io/v1
kind: PaymentHubDeployment
metadata:
  name: ph-ee-connector-ams-mifos
  namespace: paymenthub
spec:
  enabled: true
  waitForGatewayEnabled: true
  tlsKeystoreEnabled: true
  rbacEnabled: false
  secretEnabled: false
  configMapEnabled: false
  ingressEnabled: true
  initContainerEnabled: true
  volMount:
    enabled: true
    name: ph-ee-config
  replicas: 1
  # Migrated to paymenthub-ee-connector-ams-mifosx (Java 21/Spring Boot 3.4).
  # Main port unchanged (5000); the old 7070 "http" port no longer exists —
  # confirmed via `docker inspect` (single EXPOSE 5000).
  image: docker.io/openmf/paymenthub-ee-connector-ams-mifosx:dev-latest
  containerPort: 5000
  resources:
    limits:
      cpu: 500m
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 384Mi
  ingress:
    className: nginx
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/enable-cors: "true"
      nginx.ingress.kubernetes.io/cors-allow-origin: "*"
      nginx.ingress.kubernetes.io/cors-allow-methods: "PUT, GET, POST, OPTIONS, DELETE, PATCH"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,Keep-Alive,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,Platform-TenantId,platform-tenantid,purpose,Purpose,type,filename,x-callback-url,x-callbackurl,X-CallbackURL,x-correlationid,x-correlation-id,X-Correlation-ID,x-program-id,x-registering-institution-id,x-signature,privateKey,privatekey,Sec-Fetch-Dest,Sec-Fetch-Mode,Sec-Fetch-Site,Sec-GPC,Pragma"
      nginx.ingress.kubernetes.io/cors-expose-headers: "Content-Length,Content-Range,X-Correlation-ID,x-correlation-id"
      nginx.ingress.kubernetes.io/cors-max-age: "86400"
      nginx.ingress.kubernetes.io/enable-access-log: "true"
    tls:
      - secretName: sandbox-secret
    rules:
      - host: ams-mifos.local
        paths:
          - path: "/"
            pathType: ImplementationSpecific
            backend:
              service:
                name: ph-ee-connector-ams-mifos
                port:
                  number: 80
  services:
    - name: ph-ee-connector-ams-mifos
      ports:
        - name: port
          port: 80
          targetPort: 5000
          protocol: TCP
        - name: http
          port: 70
          targetPort: 5000
          protocol: TCP
      selector:
        app: ph-ee-connector-ams-mifos
      sessionAffinity: None
      type: ClusterIP
  environment:
    - name: SPRING_PROFILES_ACTIVE
      value: "fin12,bb"
    - name: ZEEBE_BROKER_CONTACTPOINT
      value: "paymenthub-infra-zeebe-gateway:26500"
    - name: DFSPIDS
      value: "greenbank,redbank,bluebank"
    - name: ams_local_enabled
      value: "true"
    - name: ams_local_interop_host
      value: "http://fineract-server.mifosx.svc.cluster.local:8080"
    - name: ams_local_account_host
      value: "http://fineract-server.mifosx.svc.cluster.local:8080"
    - name: ams_local_customer_host
      value: "http://fineract-server.mifosx.svc.cluster.local:8080"
    - name: ams_local_auth_host
      value: "http://fineract-server.mifosx.svc.cluster.local:8080"
    - name: ams_local_loan_host
      value: ""
    - name: JAVA_TOOL_OPTIONS
      value: "-Xms128m -Xmx256m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m -XX:MaxMetaspaceSize=128m"
