# Declare global configurations
global:
  kibanaEnabled: true

############### Kafka and Zookeeper ####################
## Reference: https://github.com/bitnami/charts/blob/main/bitnami/kafka/values.yaml
kafka:
  enabled: true
  fullnameOverride: "kafka"
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 3.6.0-debian-11-r0 
  persistence:
    enabled: false
  externalAccess:
    enabled: false

  broker:
    replicaCount: 1
    heapOpts: "-Xms256M -Xmx512M"
    resources:
      limits:
        memory: "1Gi"  # Must exceed heap + JVM overhead (metaspace, native, GC threads)
        cpu: "1000m"
      requests:
        memory: "512Mi"
        cpu: "250m"
  
  extraConfig: |
    auto.create.topics.enable=true
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    default.replication.factor=1
    min.insync.replicas=1

  # need this to ensure redpanda-console can connect to kafka
  listeners:
    client:
      protocol: PLAINTEXT
      # Explicitly advertise using the Kafka service name
      advertisedListeners: PLAINTEXT://kafka:9092 
    interBroker:
      protocol: PLAINTEXT
      # For a single-node setup, interBroker can also point to client.
      advertisedListeners: PLAINTEXT://kafka:9092 

  extraEnvVars:
    - name: KAFKA_CFG_ADVERTISED_LISTENERS
      value: PLAINTEXT://kafka:9092
    # - name: KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
    #   value: "1"
    # - name: KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR
    #   value: "1"
    # - name: KAFKA_CFG_DEFAULT_REPLICATION_FACTOR
    #   value: "1"
    # - name: KAFKA_CFG_MIN_INSYNC_REPLICAS
    #   value: "1"

  auth:
    enabled: false
    clientProtocol: plaintext

  kraft:
    enabled: false

  ## https://github.com/bitnami/charts/blob/main/bitnami/zookeeper/values.yaml
  zookeeper:
    enabled: true
    persistence:
      enabled: false
    image:
      registry: docker.io
      repository: bitnamilegacy/zookeeper
      tag: 3.9.1-debian-11-r1
    fullnameOverride: "zookeeper"
    heapOpts: "-Xms64M -Xmx256M"

    resources: 
      limits:
        memory: "256Mi" # Using Mi for clarity and consistency
        cpu: "200m"
      requests: 
        memory: "64Mi" # Using Mi for clarity and consistency
        cpu: "50m"
    #replicaCount: 1   

  controller:
    replicaCount: 0

  ## Kafka provisioning
  provisioning:
    enabled: true
    numPartitions: 1
    replicationFactor: 1

    topics:
      - name: __consumer_offsets
        partitions: 50
        replicationFactor: 1    
      - name: KAFKA_AUDITS_TOPIC
        value: audits
      - name: KAFKA_LOGS_TOPIC
        value: logs
      - name: AccountLookupBcRequests
        value: AccountLookupBcRequests
      - name: AccountLookupBcEvents
        value: AccountLookupBcEvents
      - name: AccountLookupBcResponses
        value: AccountLookupBcResponses
      - name: AccountLookupBcErrors
        value: AccountLookupBcErrors
      - name: OperatorBcErrors
        value: OperatorBcErrors
      - name: QuotingBcErrors
        value: QuotingBcErrors
      - name: QuotingBcEvents
        value: QuotingBcEvents
      - name: QuotingBcRequests
        value: QuotingBcRequests
      - name: SettlementsBcRequests
        value: SettlementsBcRequests
      - name: TransfersBcErrors
        value: TransfersBcErrors
      - name: TransfersBcEvents
        value: TransfersBcEvents
      - name: TransfersBcRequests
        value: TransfersBcRequests
      - name: SettlementsBcEvents
        value: SettlementsBcEvents
      - name: SettlementsBcCommands
        value: SettlementsBcCommands
      - name: PlatformConfigurationBcEvents
        value: PlatformConfigurationBcEvents
      - name: TransfersBcTimeouts
        value: TransfersBcTimeouts
      - name: ParticipantsBcEvents
        value: ParticipantsBcEvents
      - name: SchedulingBcCommands
        value: SchedulingBcCommands
      - name: SchedulingBcEvents
        value: SchedulingBcEvents
      - name: SecurityBcAuthorizationEvents
        value: SecurityBcAuthorizationEvents
      - name: SecurityBcEvents
        value: SecurityBcEvents
      - name: zeebe-export
        value: zeebe-export

    nodeSelector: {}
    tolerations: []
    waitForKafka: true
############### Kafka and Zookeeper ####################

############### RedPanda Console for Kafka  ####################
# https://artifacthub.io/packages/helm/redpanda-data/console?modal=values
# redpanda kakfa console config

redpanda-console:
  enabled: true
  fullnameOverride: rpconsole

  console:
    config:
      kafka:
        brokers:
          - kafka:9092

  ingress:
    enabled: true
    className: nginx
    hosts:
      - host: redpanda-console.mifos.gazelle.test
        paths:
          - path: /
            pathType: ImplementationSpecific

############### MongoDB  ####################
mongodb:
  enabled: true
  persistence:
    enabled: false
  # image:
  #   tag: 7.0

  fullnameOverride: mongodb
  settings:
    rootUsername: root
    rootPassword: mongoDbPas42

  # Cap WiredTiger cache to 256MB — default is 50% of node RAM which starves
  # other pods on a single-node dev cluster.
  args:
    - "--wiredTigerCacheSizeGB=0.25"

  resources:
    requests:
      memory: "384Mi"
    limits:
      memory: "768Mi"

  extraEnv:
    - name: MONGO_INITDB_ROOT_USERNAME
      value: "root"
    - name: MONGO_INITDB_ROOT_PASSWORD
      value: "mongoDbPas42"

############### Mongo Express ####################
# mongo express config
mongo-express:
  fullnameOverride: mongo-express
  enabled: true

  # image:
  #   tag: 1.0.0

  livenessProbe:
    initialDelaySeconds: 30
  readinessProbe:
    initialDelaySeconds: 30

  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - host: mongoexpress.mifos.gazelle.test
        paths:
          - /

  mongodbEnableAdmin: true
  mongodbAdminUsername: root
  mongodbAdminPassword: mongoDbPas42

  basicAuthUsername: admin
  basicAuthPassword: admin

  extraEnv:
    - name: ME_CONFIG_MONGODB_URL
      value: "mongodb://root:mongoDbPas42@mongodb:27017/"

############### Redis  ####################
## Reference: https://github.com/bitnami/charts/blob/main/bitnami/redis/values.yaml
redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
  fullnameOverride: redis
  architecture: standalone
  auth:
    enabled: false
  master:
    disableCommands: []
    persistence:
      enabled: false

############### Elasticsearch and Kibana  ####################
elasticsearch:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/elasticsearch
    tag: 8.10.4-debian-11-r0
  sysctlImage:
    enabled: false

  security:
    elasticPassword: elasticSearchPas42
    tls:
      restEncryption: false

  # coordinating:
  #   replicaCount: 1

  master:
    masterOnly: false
    replicaCount: 1
    persistence:
      enabled: false
    heapSize: 512m
    resources:
      requests:
        memory: "768Mi"
        cpu: "100m"
      limits:
        memory: "2Gi"
        cpu: "1000m"


  data:
    replicaCount: 0
  coordinating:
    replicaCount: 0
  ingest:
    replicaCount: 0

  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: elasticsearch.mifos.gazelle.test
    tls:
      - enabled: false

  kibana:
    image:
      registry: docker.io
      repository: bitnamilegacy/kibana
      tag: 8.10.4-debian-11-r0
    persistence:
      enabled: false
    env:
      - name: NODE_OPTIONS
        value: "--max-old-space-size=256" # Set Kibana's JS heap to 256MB 

    resources:
      requests:
        memory: "400Mi"  # Request enough memory for the heap + overhead
        cpu: "400m"
      limits:
        memory: "800Mi" # Allow some buffer over the heap for OS page cache and other overhead
        cpu: "400m" # 
    ingress:
      enabled: true
      ingressClassName: nginx
      hostname: kibana.mifos.gazelle.test
      tls:
        enabled: false

## GAZ-305 (MifosX moved from MySQL to Postgres) 
postgresql:
  enabled: true
  fullnameOverride: "postgres"   # -> postgres.infra.svc.cluster.local:5432
  image:
    repository: bitnamilegacy/postgresql
    tag: "16.6.0"
    debug: false
  auth:
    # Fineract connects as the postgres superuser (mirrors MySQL's root usage).
    postgresPassword: "postgrespw"
  primary:
    resources:
      requests:
        # bumped 256Mi -> 384Mi; this instance now also hosts the
        # mifos_flowable schema for the Workflow Engine (Flowable).
        memory: "384Mi"
      limits:
        # (see requests note above).
        memory: "768Mi"
    # Create the two bootstrap DBs Fineract needs on first init, mirroring the
    # upstream mifosx-platform postgresql/ init script. Tenant DBs (greenbank/
    # bluebank/redbank) are created later by the ported update-mifos-tenants.sh.
    initdb:
      scripts:
        01-create-fineract-dbs.sql: |
          CREATE DATABASE fineract_tenants;
          CREATE DATABASE fineract_default;
          CREATE DATABASE creditbureau;
        # Workflow Engine (Flowable) DB. Flowable auto-creates its own
        # tables inside this database on first startup (schema-update=true).
        02-create-workflow-db.sql: |
          CREATE DATABASE mifos_flowable;
        03-create-messagegateway-db.sql: |
          CREATE DATABASE messagegateway;
        04-create-loanrisk-db.sql: |
          CREATE DATABASE loanrisk;

############### Keycloak (SSO for paymenthub-ee-operationsui-react) ####################
## Uses this chart's own Postgres instance above (own database, same superuser) rather
## than a bundled one — postgresql.enabled: false + externalDatabase.
keycloak:
  enabled: true
  fullnameOverride: "keycloak"
  image:
    registry: docker.io
    repository: bitnamilegacy/keycloak
    tag: 26.3.3-debian-12-r0
  auth:
    adminUser: admin
    adminPassword: admin
  # Dev-mode: TLS is terminated at the shared nginx ingress, Keycloak itself runs
  # plain HTTP and trusts nginx's X-Forwarded-* headers.
  production: false
  proxyHeaders: "xforwarded"
  # 1Gi limit OOMKilled Keycloak during its first-boot Quarkus augmentation step
  # (before it even reaches the readiness probe) — bumped to give that headroom.
  resources:
    requests:
      memory: 768Mi
      cpu: 200m
    limits:
      memory: 1536Mi
      cpu: 500m
  postgresql:
    enabled: false
  externalDatabase:
    host: "postgres"
    port: 5432
    user: postgres
    password: "postgrespw"
    database: keycloak
  # postgresql.primary.initdb.scripts below only runs against a brand-new, empty data
  # directory -- useless for redeploys onto an already-initialized instance (which is
  # every real deployment, since postgres predates Keycloak here). Create the database
  # idempotently on every pod start instead, same pattern docs/MIFOSX.md prescribes for
  # new components sharing this Postgres.
  initContainers:
    - name: create-keycloak-db
      image: docker.io/bitnamilegacy/postgresql:16.6.0
      imagePullPolicy: IfNotPresent
      env:
        - name: PGPASSWORD
          value: "postgrespw"
      command:
        - /bin/bash
        - -c
        - |
          until pg_isready -h postgres -p 5432 -U postgres; do
            echo "waiting for postgres..."
            sleep 2
          done
          psql -h postgres -U postgres -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 || \
            psql -h postgres -U postgres -d postgres -c "CREATE DATABASE keycloak"
  ingress:
    enabled: true
    ingressClassName: nginx
    hostname: keycloak-ops.mifos.gazelle.test
  # Declarative realm/client/user import via the bundled keycloak-config-cli job —
  # no manual Admin-API calls needed after deploy. Users aren't part of a normal
  # realm export; the "mifos" test user is defined explicitly below with
  # firstName/lastName/email set, since Keycloak's default VERIFY_PROFILE required
  # action otherwise blocks login with a generic "Account is not fully set up" error.
  keycloakConfigCli:
    enabled: true
    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak-config-cli
    configuration:
      paymenthub.yaml: |
        realm: paymenthub
        enabled: true
        clients:
          - clientId: opsapp
            publicClient: true
            standardFlowEnabled: true
            directAccessGrantsEnabled: true
            redirectUris:
              - "http://localhost:5173/*"
              - "https://ops.mifos.gazelle.test/*"
            webOrigins:
              - "http://localhost:5173"
              - "https://ops.mifos.gazelle.test"
        # Demo/test login — mifos-gazelle is a local dev/demo tool, not a production
        # deployment target, so a well-known test credential here is acceptable.
        users:
          - username: mifos
            enabled: true
            firstName: Mifos
            lastName: Admin
            email: mifos@mifos.gazelle.test
            emailVerified: true
            credentials:
              - type: password
                value: password
                temporary: false

