# published in kafka-client-lib 0.5.13. Mojaloop no longer maintains Mojaloop vNext Beta1, so no
# fixed 0.5.x image will come. The deployment mounts this over the file in the image.
# To check it: diff it against the file in the image; only the lines marked
# "GAZELLE PATCH" differ.
