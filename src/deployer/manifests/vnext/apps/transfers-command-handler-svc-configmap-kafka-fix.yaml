# whose consume loop can run twice after start-up (once on "subscribed", once on the first
# rebalance) because its _consuming guard is set too late. Two loops hand the transfers
# aggregate two batches at once; it keeps batch state in shared fields, throws "Could not
# find corresponding request for checkLiquidAndReserve" and the service exits, leaving
# transfers stuck in RECEIVED.
