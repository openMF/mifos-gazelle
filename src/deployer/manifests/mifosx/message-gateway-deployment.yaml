apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: message-gateway
    tier: backend
  name: message-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: message-gateway
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: message-gateway
        tier: backend
    spec:
      initContainers:
        - name: ensure-messagegateway-db
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              value: "postgrespw"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              until pg_isready -h postgres.infra.svc.cluster.local -p 5432 -U postgres; do
                echo "waiting for postgres..."; sleep 3
              done
              if psql -h postgres.infra.svc.cluster.local -U postgres -tAc \
                   "SELECT 1 FROM pg_database WHERE datname='messagegateway'" | grep -q 1; then
                echo "messagegateway DB already exists"
              else
                echo "creating messagegateway DB"
                createdb -h postgres.infra.svc.cluster.local -U postgres messagegateway
              fi
      containers:
        - name: message-gateway
          image: openmf/message-gateway:dev-51abedb
          imagePullPolicy: IfNotPresent
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres.infra.svc.cluster.local:5432/messagegateway"
            - name: DB_USERNAME
              value: "postgres"
            - name: DB_PASSWORD
              value: "postgrespw"
            - name: DB_DRIVER
              value: "org.postgresql.Driver"
          ports:
            - containerPort: 9191
              protocol: TCP
            - containerPort: 5009
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9191
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9191
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
      restartPolicy: Always
