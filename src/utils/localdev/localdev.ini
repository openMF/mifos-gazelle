# localdev.ini - Local Development Configuration
# Location: mifos-gazelle/src/utils/localdev/localdev.ini
#
# Configures PHEE components for local development with hostPath volumes.
# All components are operator-managed (PaymentHubDeployment CRs); localdev.py
# patches the live Kubernetes Deployment directly via kubectl (k8s-direct-mode).
#
# Variable expansion is supported:
#   - Environment variables: $HOME, $USER, etc.
#   - Custom variables: ${gazelle-home} references [general] section

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
[general]
# Root directory of your mifos-gazelle repository
# You can use $HOME or other environment variables
gazelle-home = $HOME/mifos-gazelle


# ============================================================================
# PAYMENTHUB OPERATOR
# ============================================================================
# Runs in-cluster with a hostPath mount (same pattern as other k8s-direct components).
# The operator subdirectory is paymenthub-operator/ inside the mifos-operators monorepo.
# Build: cd ~/mifos-operators/paymenthub-operator && ./gradlew build -x test
# (Note: operator targets Java 21, not 17)
# ----------------------------------------------------------------------------
[paymenthub-operator]
app_type = operator
k8s_deploy_name = ph-ee-operator
k8s_namespace = paymenthub
image = eclipse-temurin:21
jarpath = /app/build/libs/paymenthub-operator-1.0.0.jar
hostpath = ${HOME}/mifos-operators/paymenthub-operator
checkout_enabled = true
reponame = git@github.com:openMF/mifos-operators.git
branch_or_tag = main
checkout_to_dir = ${HOME}


# ============================================================================
# COMPONENT CONFIGURATIONS
# ============================================================================
# Each section below defines a component to patch for local development.
#
# Required fields:
#   directory  = Path to the Helm chart directory containing templates/deployment.yaml
#   image      = Container image with JDK or runtime to use
#   jarpath    = Path where your JAR/executable lives inside the container
#   hostpath   = Local filesystem path to your project directory
#
# Optional checkout fields (for automatic repository management):
#   checkout_enabled = true/false - Enable automatic checkout of this component's repo
#   reponame         = Git repository URL (https or ssh)
#   branch_or_tag    = Branch or tag to checkout (default: main)
#   checkout_to_dir  = Directory to clone into (default: $HOME)
#
# Mount paths:
#   - For springboot: hostpath mounted at /app inside the container
#   - For webapp: hostpath mounted at /usr/share/nginx/html inside the container
#
# Examples:
#   SpringBoot app: hostpath=$HOME/ph-ee-connector-channel, jarpath=/app/build/libs/connector-channel.jar
#   Webapp: hostpath=$HOME/ph-ee-operations-web/dist, no jarpath needed

# ----------------------------------------------------------------------------
# Connector Channel  [OPERATOR-MANAGED]
# Deployment is created by the PHEE operator from a PaymentHubDeployment CR.
# Helm patching no longer applies.
# k8s_deploy_name enables ./localdev.py --setup --component channel to patch
# the running Deployment directly (hostPath + JAR override).
# ----------------------------------------------------------------------------
