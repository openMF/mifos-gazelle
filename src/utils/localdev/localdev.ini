# ============================================================================
# NOTES
# ============================================================================
#
# All PHEE components are operator-managed (deployed by the PaymentHub Kubernetes
# operator from PaymentHubDeployment CRs in src/deployer/operators/paymenthub/config/cr/).
# There is no Helm chart patching — localdev.py patches live Kubernetes Deployments.
#
# Component types:
#   k8s_deploy_name present  → patchable (k8s-direct-mode: fetches+patches live Deployment)
#   checkout_enabled only    → repo checkout/update only, no deployment patching
#
# The operator itself (paymenthub-operator) is also k8s_deploy_name-patchable —
# its Deployment is applied directly by paymenthub.sh, not reconciled by anything,
# so it needs no "scale to 0 first" step unlike the components below.
# To enable k8s-direct patching for a checkout-only component:
#   k8s_deploy_name = ph-ee-<service>   (verify with: kubectl get deployments -n paymenthub)
#   k8s_namespace   = paymenthub
#   app_type        = springboot
#   image           = eclipse-temurin:17
#   jarpath         = /app/build/libs/<artifact>.jar
#   hostpath        = ${HOME}/<repo-dir>
#
# Commands:
#   ./localdev.py --status                        show all component states
#   ./localdev.py --setup --component <name>      checkout + patch
#   ./localdev.py --checkout                      clone/update repos only
#   ./localdev.py --update                        pull latest for existing repos
#   ./localdev.py --restore --component <name>    restore original Deployment from backup
#
# Build JARs with Java 21 for migrated paymenthub-ee-* repos (channel,
# bulk-processor, connector-bulk, mock-payment/integration-test,
# operations-app/bff, identity-account-mapper/account-mapper, ams-mifos,
# connector-mojaloop, notifications, connector-gsma, bill-pay/p2g).
# The still-ph-ee-* holdouts (operations-web, importer-rdbms, zeebe-ops,
# connector-mccbs) remain on Java 17 until their migration lands upstream:
#   JAVA_HOME=/home/mifosu/jdk-17.0.2 ./gradlew build -x test
#
# ============================================================================