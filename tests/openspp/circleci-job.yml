# CircleCI job for OpenSPP, parked on purpose.
#
# CircleCI does not read this file. The engine reads the config path set for the
# project, which defaults to .circleci/config.yml, and nothing there references
# this file. It is kept outside .circleci/ so it cannot be picked up by accident.
#
# It is a complete config, so it can be checked without wiring it up:
#
#   circleci config validate tests/openspp/circleci-job.yml
#
# To enable it, copy the command, the job and the workflow entry into
# .circleci/config.yml, next to the ones already there.

version: 2.1

commands:
  deploy_and_verify_openspp:
    description: "Build the OpenSPP2 image, deploy OpenSPP, and run its smoke test (amd64 only)"
    steps:
      - run:
          name: Environment setup (k3s)
          command: |
            chmod +x ./setup-env.sh ./run.sh
            sudo ./setup-env.sh -e local -u "$USER" -d true -y
      - run:
          name: Build and import the OpenSPP2 image (build-only, not published)
          command: |
            # Image and source pin come from config.ini, the one place they are declared. crudini is
            # installed by the setup step above.
            source_repo=$(crudini --get config/config.ini openspp OPENSPP_SOURCE_REPO)
            source_ref=$(crudini --get config/config.ini openspp OPENSPP_SOURCE_REF)
            image="$(crudini --get config/config.ini openspp OPENSPP_IMAGE_REPOSITORY):$(crudini --get config/config.ini openspp OPENSPP_IMAGE_TAG)"
            git clone --branch "$source_ref" --depth 1 "$source_repo" repos/OpenSPP2
            docker build --target production -t "$image" \
              -f repos/OpenSPP2/docker/Dockerfile repos/OpenSPP2
            docker save "$image" | sudo k3s ctr images import -
      - run:
          name: Deploy OpenSPP
          command: ./run.sh -m deploy -a openspp -d true
      - run:
          name: Smoke test
          command: bash tests/openspp/smoke.sh

jobs:
  # amd64 only: the official postgis/postgis image publishes no arm64 manifest, so an arm64 job would
  # need an arm64 PostGIS image passed in. OpenSPP itself does run on arm64.
  deploy-test-openspp-amd64:
    machine:
      image: ubuntu-2004:current
    resource_class: large
    steps:
      - checkout
      - deploy_and_verify_openspp

workflows:
  test-openspp:
    jobs:
      - deploy-test-openspp-amd64
