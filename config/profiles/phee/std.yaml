# PH-EE JVM Profile: Standard
# Optimized for balanced environments (8GB - 32GB RAM)
# The JVM will automatically use G1GC due to standard container limits.

ph-ee-engine:
  operations_app:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 768Mi

  connector_mojaloop:
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 768Mi

  connector_mock_payment_schema:
