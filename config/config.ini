# Mifos Gazelle Configuration File
# This file configures the deployment settings for Mifos Gazelle, including Kubernetes cluster setup,
# MySQL database, and component-specific settings for MifosX, vNext, and Payment Hub EE.

[general]
# Deployment mode: 'deploy' to set up the environment, 'cleanall' to remove it.
mode = deploy
# Domain used for Mifos Gazelle services (e.g., *.mifos.gazelle.test).
GAZELLE_DOMAIN = mifos.gazelle.test
# Version of Mifos Gazelle being deployed.
GAZELLE_VERSION = 2.0.0
# Write a full deployment log to /tmp/gazelle-YYYYMMDD-HHMM.log (default: false)
logging = false
# Maximum seconds to wait for pods to be Running and services to be fully
# initialised before running post-deploy data generation steps.
# The main bottleneck is Fineract's Liquibase migrations on first boot.
# Default: 600 (10 min). Slow hardware / Raspberry Pi: 1800. Managed cold-start: 900.
startup_timeout = 1200


[kubernetes]
# Environment type: 'local' for a local cluster (Linux k3s or macOS Colima — auto-detected),
# or 'remote' for an existing remote cluster.
environment = local
# Operating system user to configure Kubernetes for. Must be a non-root user that exists on the system.
k8s_user = $USER
# Tested Kubernetes (k3s) version to install for local clusters [Developer use only do not change]
k8s_version = 1.35
# Path to the kubeconfig file. Defaults to ~/.kube/config if not specified.
kubeconfig_path = ~/.kube/config
# Minimum free disk space required in GB.
min_free_space = 30
# CPU cores and memory (GiB) available for Kubernetes.
# On macOS these set the Colima VM size; on Linux they set the minimum host
# RAM check run before installation begins (k3s uses host resources directly).
k8s_cpu = 4
k8s_mem = 16
# Tested Linux distributions It is Ubuntu only for now so don't change this
linux_os_list = Ubuntu
# Tested Ubuntu versions [developer use only => do not change ] 
ubuntu_ok_versions_list = 22 24

[dockerhub]
# Docker Hub credentials for authenticated image pulls (optional).
# If set, increases rate limit from 100 to 200 pulls per 6 hours.
# Leave commented out or empty to use anonymous pulls.
# DOCKERHUB_USERNAME = your-dockerhub-username
# DOCKERHUB_PASSWORD = your-dockerhub-password
# DOCKERHUB_EMAIL = your-email@example.com

[mysql]
# MySQL service name in the Kubernetes cluster.
MYSQL_SERVICE_NAME = mysql
# MySQL service port in the Kubernetes cluster.
MYSQL_SERVICE_PORT = 3306
# Local port for port forwarding to access MySQL.
LOCAL_PORT = 3307
# Maximum time to wait for MySQL to be ready (in seconds).
MAX_WAIT_SECONDS = 60
# MySQL host for local access (typically 127.0.0.1 for local clusters).
MYSQL_HOST = 127.0.0.1

[infra]
# Enable or disable infrastructure components (e.g., NGINX, Helm repos).
enabled = true
# Namespace for infrastructure components.
INFRA_NAMESPACE = infra
# Helm release name for infrastructure components.
INFRA_RELEASE_NAME = infra

[mifosx]
# Enable or disable MifosX deployment.
enabled = true
# Namespace for MifosX components.
MIFOSX_NAMESPACE = mifosx
# Fineract API credentials used for readiness polling and health checks.
FINERACT_USERNAME = mifos
FINERACT_PASSWORD = password
# Space-separated list of Fineract tenant IDs to wait on during startup.
FINERACT_TENANTS = greenbank bluebank redbank
# Manifests are vendored in src/deployer/manifests/mifosx/ — no repo clone needed.
# MIFOSX_REPO_DIR = mifosx
# MIFOSX_BRANCH = mifos-v2.0.0
# MIFOSX_REPO_LINK = https://github.com/openMF/mifosx-docker.git

[vnext]
# Enable or disable vNext deployment.
enabled = true
# Namespace for vNext components.
VNEXT_NAMESPACE = vnext
# Manifests are vendored in src/deployer/manifests/vnext/ — no repo clone needed.
# VNEXTBRANCH = beta1
# VNEXTREPO_DIR = vnext
# VNEXT_REPO_LINK = https://github.com/mojaloop/platform-shared-tools.git

[paymenthub]
# Enable or disable PaymentHub deployment.
enabled = true
# Namespace for PaymentHub components.
PH_NAMESPACE = paymenthub
# Helm release name for PaymentHub infrastructure services (Zeebe, operationsmysql, Redis, MinIO, Kafka).
PH_INFRA_RELEASE_NAME = paymenthub-infra
# Operator image to deploy — format: repo/image:tag
PH_OPERATOR_IMAGE = openmf/ph-ee-k8s-operators:dev-dd9ac20             
# hostPath toggle: when set to an existing directory, deploy_ph_operator() uses
# eclipse-temurin:21 + local JAR instead of the published Docker image.
# Build first: cd $PH_OPERATOR_SOURCE_DIR && ./gradlew build -x test
# PH_OPERATOR_SOURCE_DIR = $HOME/mifos-operators/paymenthub-operator

[mastercard-demo]
# Enable or disable mastercard-demo deployment.
enabled = false
# Namespace for mastercard components.
MASTERCARD_NAMESPACE = mastercard-demo
# Mastercard CBS connector home directory
MASTERCARD_CBS_HOME = ~/ph-ee-connector-mccbs
# Mastercard CBS API URL (sandbox)
MASTERCARD_API_URL = https://sandbox.api.mastercard.com
# Enable local development mode (hostPath mounting for hot reload)
MASTERCARD_LOCALDEV_ENABLED = false
# Partner ID from Mastercard Developers portal
MASTERCARD_PARTNER_ID =

# OAuth1 Configuration (get consumer key from Mastercard Developers portal)
MASTERCARD_CONSUMER_KEY =
MASTERCARD_SIGNING_KEY_ALIAS =
MASTERCARD_SIGNING_KEY_PASSWORD =

# JWE Encryption Configuration
MASTERCARD_ENCRYPTION_ENABLED = false
MASTERCARD_ENCRYPTION_CERT_PASSWORD =
MASTERCARD_ENCRYPTION_FINGERPRINT =
MASTERCARD_DECRYPTION_KEY_ALIAS =
MASTERCARD_DECRYPTION_KEY_PASSWORD =

# Certificate file paths - read from this machine by run.sh and stored as a K8s Secret.
# This is required for Docker image deployments and remote clusters where certs cannot
# be bundled in the image. Leave empty only when using localdev hostPath mode with certs
# already compiled into the JAR.
MASTERCARD_SIGNING_KEY_PATH =
MASTERCARD_ENCRYPTION_CERT_PATH =
MASTERCARD_DECRYPTION_KEY_PATH =