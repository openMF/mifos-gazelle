############################################################
# PaymentHub infrastructure override values for config/ph_values.yaml
#
# All stable defaults are baked into src/deployer/helm/paymenthub-infra/values.yaml.
# Only domain-specific hostnames and version-pinned artifacts belong here.
#
# Hostnames referencing "mifos.gazelle.test" are substituted at deploy time
# by apply_domain_to_file() with the configured $GAZELLE_DOMAIN.
############################################################

camunda-platform:
  zeebe:
    # Downloads the Kafka exporter JAR from JFrog at pod start.
    # Pinned to one exact build: a SNAPSHOT is published under a timestamped file
    # name, so this URL always gets the same jar. The exporter's class name is set
    # with it, in src/deployer/helm/paymenthub-infra/values.yaml
    # (ZEEBE_BROKER_EXPORTERS_KAFKA_CLASSNAME); change both together.
    # paymenthub-ee-exporter 2.0.0.mifos-SNAPSHOT, built from paymenthub-ee-data-pipeline
    # dev 286ea05 (PHEE-465: org.mifos.phee packages, Zeebe Community License attached).
    # "&&": a failed download fails the init container, rather than starting the
    # broker without its exporter.
    extraInitContainers:
      - name: init-ph-ee-kafka-exporter
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command: ['/bin/sh', '-c']
        args:
          - >
            wget -O /exporters/ph-ee-kafka-exporter.jar
            "https://mifos.jfrog.io/artifactory/phee-gradle-local/org/mifos/paymenthub-ee-exporter/2.0.0.mifos-SNAPSHOT/paymenthub-ee-exporter-2.0.0.mifos-20261128.012627-1.jar"
            && ls -al /exporters/
        volumeMounts:
          - name: exporters
            mountPath: /exporters/
    affinity: {}

  operate:
    affinity: {}
    ingress:
      enabled: true
      host: "zeebe-operate.mifos.gazelle.test"

  zeebe-gateway:
    ingress:
      host: "zeebe-gateway.mifos.gazelle.test"

minio:
  ingress:
    hosts:
      - minio.mifos.gazelle.test
  consoleIngress:
    hosts:
      - minio-console.mifos.gazelle.test
