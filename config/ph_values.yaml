############################################################
# PaymentHub infrastructure override values for config/ph_values.yaml
#
# All stable defaults are baked into src/deployer/helm/paymenthub-infra/values.yaml.
# Only domain-specific hostnames and version-pinned artifacts belong here.
#
# Hostnames referencing "mifos.gazelle.test" are substituted at deploy time
# by apply_domain_to_file() with the configured $GAZELLE_DOMAIN.
############################################################

camunda-platform:
  zeebe:
    # Downloads the Kafka exporter JAR from JFrog at pod start.
    # Version and URL are pinned here because they change with each PHEE release.
    extraInitContainers:
      - name: init-ph-ee-kafka-exporter
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command: ['/bin/sh', '-c']
        args:
          - >
            wget -O /exporters/ph-ee-kafka-exporter.jar
            "https://mifos.jfrog.io/artifactory/phee-gradle-local/org/mifos/phee/phee-exporter/exporter-1.1.1-SNAPSHOT.jar";
            ls -al /exporters/
        volumeMounts:
          - name: exporters
            mountPath: /exporters/
    affinity: {}

  operate:
    affinity: {}
    ingress:
      enabled: true
      host: "zeebe-operate.mifos.gazelle.test"

  zeebe-gateway:
    ingress:
      host: "zeebe-gateway.mifos.gazelle.test"

minio:
  ingress:
    hosts:
      - minio.mifos.gazelle.test
  consoleIngress:
    hosts:
      - minio-console.mifos.gazelle.test
